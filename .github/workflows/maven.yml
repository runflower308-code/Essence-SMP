name: Build EssenceSMP Solar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EssenceSMP-Solar-Plugin
          path: target/*.jar
