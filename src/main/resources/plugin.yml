name: EssenceSMP-Solar
version: 1.0.0
main: com.essencesmp.solar.SolarPlugin
api-version: '1.21'
author: EssenceSMP
description: Solar Essence abilities and tier upgrader system.
commands:
  solar:
    description: Use Solar Essence abilities.
    usage: /solar <flare|judgment|eclipse>
  essence:
    description: View Essence tiers and manage upgrade items.
    usage: /essence [giveupgrader <player|self> <tier2|tier3>]
permissions:
  essencesmp.admin:
    description: Allows administrative Essence commands.
    default: op
